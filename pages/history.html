<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Workflow Studio | Audit Logs & Execution History</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/static/css/shared.css"/>
</head>
<body>

    <div id="navbarContainer"></div>

    <main class="studio-layout">
        <header class="page-header">
            <div>
                <h1 class="page-title">
                    <span class="material-symbols-outlined" style="color: var(--accent-terracotta);">history</span>
                    Code History & Saved Work
                </h1>
                <p class="page-subtitle">Review your past code generation runs, copy code snippets, or view automated test results.</p>
            </div>

            <button class="cyber-btn cyber-btn-secondary" style="color: var(--accent-rose);" onclick="clearHistoryLog()" data-tooltip="Clear History: Deletes saved past code run logs from your local browser storage.">
                <span class="material-symbols-outlined">delete_sweep</span>
                Clear Saved History
            </button>
        </header>

        <!-- Filters Panel -->
        <div class="studio-card" style="margin-bottom: 28px;">
            <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 260px; position: relative;">
                    <span class="material-symbols-outlined" style="position: absolute; left: 14px; top: 12px; color: var(--text-muted); font-size: 20px;">search</span>
                    <input id="searchInput" type="text" style="width: 100%; background: #f8fafc; border: 1px solid var(--border-subtle); border-radius: 10px; padding: 12px 14px 12px 44px; font-size: 14px; color: var(--text-primary); outline: none;" placeholder="Search by keyword or task description..." oninput="filterHistoryTable()" data-tooltip="Search Runs: Type any keyword (like 'prime' or 'fibonacci') to find past code runs."/>
                </div>

                <!-- Custom Web Select Component (No Native OS Dropdown) -->
                <div class="custom-select-wrapper" style="width: 220px;" data-tooltip="Filter Status: Filter past runs by Passed or Failed results.">
                    <input type="hidden" id="filterStatusSelect" value="all"/>
                    <div class="custom-select-trigger" onclick="toggleCustomSelect(this, event)">
                        <span class="custom-select-value" id="filterStatusValue">All Results</span>
                        <span class="material-symbols-outlined" style="font-size: 18px; color: var(--text-muted);">expand_more</span>
                    </div>
                    <div class="custom-select-menu" style="z-index: 3000;">
                        <div class="custom-select-option selected" data-value="all" onclick="selectFilterStatus(this, 'all', 'All Results', event)">All Results</div>
                        <div class="custom-select-option" data-value="success" onclick="selectFilterStatus(this, 'success', 'Passed Only', event)">Passed Only</div>
                        <div class="custom-select-option" data-value="failed" onclick="selectFilterStatus(this, 'failed', 'Failed Only', event)">Failed Only</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Audit Table -->
        <div class="studio-card">
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
                    <thead>
                        <tr style="border-bottom: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">
                            <th style="padding: 14px 18px;">What you asked for</th>
                            <th style="padding: 14px 18px;">Language</th>
                            <th style="padding: 14px 18px;">Result</th>
                            <th style="padding: 14px 18px;">Attempts</th>
                            <th style="padding: 14px 18px;">When</th>
                            <th style="padding: 14px 18px; text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>



    <script src="/static/js/common.js"></script>
    <script>
        let fullHistory = [];
        let currentModalCode = '';

        function toggleCustomSelect(trigger, e) {
            if (e) e.stopPropagation();
            const wrapper = trigger.closest('.custom-select-wrapper');
            document.querySelectorAll('.custom-select-wrapper').forEach(w => {
                if (w !== wrapper) w.classList.remove('open');
            });
            wrapper.classList.toggle('open');
        }

        function selectFilterStatus(opt, val, label, e) {
            if (e) e.stopPropagation();
            const wrapper = opt.closest('.custom-select-wrapper');
            const hidden = wrapper.querySelector('input[type="hidden"]');
            const valSpan = wrapper.querySelector('.custom-select-value');

            wrapper.querySelectorAll('.custom-select-option').forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');

            if (hidden) hidden.value = val;
            if (valSpan) valSpan.textContent = label;

            wrapper.classList.remove('open');
            filterHistoryTable();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const navbarRes = await fetch('/templates/navigation.html');
            if (navbarRes.ok) {
                document.getElementById('navbarContainer').innerHTML = await navbarRes.text();
                setActiveNav('history');
            }
            loadAuditHistoryTable();
        });

        async function loadAuditHistoryTable() {
            fullHistory = await fetchServerRunHistory();
            renderTable(fullHistory);
        }

        function renderTable(runs) {
            const tbody = document.getElementById('historyTableBody');
            if (runs.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="padding: 36px; text-align: center; color: var(--text-muted);">
                            No audit log records found. <a href="/generate" style="color: var(--accent-terracotta); font-weight: 600;">Generate code on Workbench</a>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = runs.map(run => {
                const trId = `run-row-${run.id}`;
                const detailId = `detail-row-${run.id}`;
                return `
                <tr id="${trId}" style="border-bottom: 1px solid var(--border-subtle); cursor: pointer;" onclick="toggleDetails('${run.id}')" data-tooltip="Click row to view full source code and test results.">
                    <td style="padding: 16px 18px; font-weight: 600; color: var(--text-primary);">${run.task}</td>
                    <td style="padding: 16px 18px;">
                        <span class="cyber-badge cyber-badge-indigo">${run.language.toUpperCase()}</span>
                    </td>
                    <td style="padding: 16px 18px;">
                        <span class="cyber-badge ${run.success ? 'cyber-badge-emerald' : 'cyber-badge-amber'}">
                            ${run.success ? 'SUCCESS' : 'FAILED'}
                        </span>
                    </td>
                    <td style="padding: 16px 18px; font-family: var(--font-mono); color: var(--text-secondary);">${run.iterations} attempt(s)</td>
                    <td style="padding: 16px 18px; color: var(--text-muted); font-size: 13px;">${new Date(run.timestamp).toLocaleString()}</td>
                    <td style="padding: 16px 18px; text-align: right; white-space: nowrap;">
                        <button class="cyber-btn cyber-btn-primary" style="font-size: 11.5px; padding: 4px 10px; margin-right: 8px;" onclick="event.stopPropagation(); reuseTask('${run.id}')">Reuse Task</button>
                        <button class="cyber-btn cyber-btn-secondary" style="font-size: 11.5px; padding: 4px 10px;" onclick="event.stopPropagation(); toggleDetails('${run.id}')">View Details</button>
                    </td>
                </tr>
                <tr id="${detailId}" style="display: none; background-color: #f8fafc; border-bottom: 1px solid var(--border-subtle);">
                    <td colspan="6" style="padding: 20px;">
                        <div style="font-size: 12.5px; color: var(--text-muted); margin-bottom: 12px;"><strong>Thread ID:</strong> ${run.thread_id || 'active'}</div>
                        <div style="margin-bottom: 16px;">
                            <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">Generated Code</div>
                            <pre style="background: #0f172a; color: #f8fafc; padding: 16px; border-radius: 8px; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; white-space: pre-wrap; margin: 0; max-height: 250px; overflow-y: auto;">${run.code ? escapeHtml(run.code) : '// No code output saved.'}</pre>
                        </div>
                        <div>
                            <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">Test Report</div>
                            <pre style="background: #0f172a; color: #94a3b8; padding: 16px; border-radius: 8px; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; white-space: pre-wrap; margin: 0; max-height: 200px; overflow-y: auto;">${run.report ? escapeHtml(run.report) : '// No sandbox output saved.'}</pre>
                        </div>
                    </td>
                </tr>
            `}).join('');
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function toggleDetails(id) {
            const detailRow = document.getElementById(`detail-row-${id}`);
            if (detailRow.style.display === 'none') {
                detailRow.style.display = 'table-row';
            } else {
                detailRow.style.display = 'none';
            }
        }

        function reuseTask(id) {
            const run = fullHistory.find(r => r.id === id);
            if (!run) return;
            
            localStorage.setItem('ai_workflow_current_task', run.task);
            localStorage.setItem('ai_workflow_current_lang', run.language);
            localStorage.setItem('langgraph_last_task', run.task);
            localStorage.setItem('langgraph_last_lang', run.language);
            
            if (typeof setCurrentWorkflowRun === 'function') {
                setCurrentWorkflowRun({ task: run.task, language: run.language });
            }
            
            if (typeof showToast === 'function') {
                showToast('Task loaded into Workspace');
            } else {
                alert('Task loaded into Workspace');
            }
            
            setTimeout(() => {
                window.location.href = '/generate';
            }, 500);
        }

        function filterHistoryTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('filterStatusSelect').value;

            const filtered = fullHistory.filter(run => {
                const matchesQuery = run.task.toLowerCase().includes(query) || run.language.toLowerCase().includes(query);
                const matchesStatus = status === 'all' || (status === 'success' && run.success) || (status === 'failed' && !run.success);
                return matchesQuery && matchesStatus;
            });

            renderTable(filtered);
        }

        function clearHistoryLog() {
            clearRunHistory();
            loadAuditHistoryTable();
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.custom-select-wrapper').forEach(w => w.classList.remove('open'));
        });
    </script>
</body>
</html>
