<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LangGraph | Verification Audit Logs</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/static/css/shared.css"/>
</head>
<body>

    <div id="navbarContainer"></div>

    <main class="studio-layout">
        <header class="page-header">
            <div>
                <h1 class="page-title">
                    <span class="material-symbols-outlined" style="color: var(--accent-terracotta);">history</span>
                    Verification Audit Logs
                </h1>
                <p class="page-subtitle">Review previous agent executions, inspect code outputs, and audit assertion reports.</p>
            </div>

            <button id="clearHistoryBtn" class="cyber-btn cyber-btn-secondary" style="color: var(--accent-terracotta);" data-tooltip="Clear Audit Log History: Empties local history store.">
                <span class="material-symbols-outlined">delete</span>
                Clear Logs
            </button>
        </header>

        <!-- Search Controls -->
        <div class="studio-card" style="margin-bottom: 24px; padding: 20px;" data-tooltip="Audit Search & Filter Controls: Filter runs by keyword or execution status.">
            <div style="display: grid; grid-template-columns: 1fr 220px; gap: 20px;">
                <input id="searchInput" type="text" placeholder="Search prompts or code content..." style="background: #f8fafc; border: 1px solid var(--border-subtle); border-radius: 10px; padding: 12px 16px; color: var(--text-primary); outline: none; font-size: 14px;" data-tooltip="Search input: Filter runs by task specification keyword."/>

                <select id="filterStatusSelect" style="background: #f8fafc; border: 1px solid var(--border-subtle); border-radius: 10px; padding: 12px 16px; color: var(--text-primary); outline: none; font-size: 14px;" data-tooltip="Filter status: Select Passed or Failed verification runs.">
                    <option value="all">All Statuses</option>
                    <option value="passed">Passed Runs</option>
                    <option value="failed">Failed Runs</option>
                </select>
            </div>
        </div>

        <!-- History Table -->
        <div class="studio-card" data-tooltip="Audit Run Table: Click any row to open the complete source code & execution report inspector modal.">
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
                    <thead>
                        <tr style="border-bottom: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">
                            <th style="padding: 14px 18px;">Task Specification</th>
                            <th style="padding: 14px 18px;">Language</th>
                            <th style="padding: 14px 18px;">Result</th>
                            <th style="padding: 14px 18px;">Loops</th>
                            <th style="padding: 14px 18px;">Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Run Modal Inspector -->
    <div id="runModal" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(12px); z-index: 1000; align-items: center; justify-content: center; padding: 24px;">
        <div class="studio-card" style="width: 100%; max-width: 920px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; background: #ffffff; border-color: var(--border-medium);">
            
            <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid var(--border-subtle);">
                <div>
                    <h2 style="font-size: 19px; font-weight: 700;" id="modalTaskTitle">Task Detail</h2>
                    <p style="font-size: 13px; color: var(--text-muted);">Historical execution audit detail</p>
                </div>
                <button id="modalCloseBtn" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer;">
                    <span class="material-symbols-outlined" style="font-size: 26px;">close</span>
                </button>
            </div>

            <div style="flex: 1; overflow-y: auto; padding: 20px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="code-editor-pane">
                    <div class="code-editor-header">
                        <span style="font-size: 12.5px; font-family: var(--font-mono); color: #fb923c;">solution_code</span>
                        <button id="modalCopyBtn" class="cyber-btn cyber-btn-secondary" style="font-size: 11.5px; padding: 3px 10px; background: #334155; color: #ffffff; border: none;">Copy</button>
                    </div>
                    <div class="code-editor-body" id="modalCodeDisplay" style="height: 320px; overflow-y: auto;"></div>
                </div>

                <div class="code-editor-pane">
                    <div class="code-editor-header">
                        <span style="font-size: 12.5px; font-family: var(--font-mono); color: #94a3b8;">verification_report</span>
                        <button id="modalDownloadBtn" class="cyber-btn cyber-btn-secondary" style="font-size: 11.5px; padding: 3px 10px; background: #334155; color: #ffffff; border: none;">Download</button>
                    </div>
                    <div class="code-editor-body" id="modalReportDisplay" style="height: 320px; overflow-y: auto; color: #94a3b8;"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/history.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const navbarRes = await fetch('/templates/navigation.html');
            if (navbarRes.ok) {
                document.getElementById('navbarContainer').innerHTML = await navbarRes.text();
                setActiveNav('history');
            }
        });
    </script>
</body>
</html>
